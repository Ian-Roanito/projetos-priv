<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/main.css">

    <title>Projeto Privado</title>


</head>
<body>
    <header>
        <nav>
            <a class="logo" href="/">Tiger Codes</a>
            <div id="hamburguer" class="mobile-menu">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <ul id="nav-list" class="nav-list">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Projetos</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        
    </main>

    <script>
        const hamburguer = document.getElementById('hamburguer');
        const navList = document.getElementById('nav-list');
        const navLinks = document.querySelectorAll('.nav-list li')
        const mobileMenu = document.getElementById('hamburguer')

        hamburguer.addEventListener('click', () => {

            // 1. Abre/fecha o menu
            navList.classList.toggle('active');
            mobileMenu.classList.toggle('active');

            // 2. Faz os links surgirem um por um
            navLinks.forEach((link, index) => {
                if (navList.classList.contains('active')) {

                    // Se o menu abrir, espera um pouco e mostra o link
                    setTimeout(() => {
                        link.classList.add('show');
                    }, 200 + (index * 100)); // 200ms de espera inicial + 100ms por item
                } else {
                    // Se o menu fechou. remove a classe imediatamente
                    link.classList.remove('show');
                }
            });
        });

    </script>
</body>
</html>
